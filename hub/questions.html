<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questions</title>
<link rel="stylesheet" href="/hub.css">
</head>
<body>
<main>
<nav><a href="/">Hub</a><a href="/play/">Play</a><a href="/status">Status</a><a href="/questions">Questions</a></nav>
<h1>Questions</h1>
<p class="dim">The loop never waits on these. It carries on with the default shown and picks up your answer at the start of its next iteration. Pick options, type anything in the box, or both.</p>
<div class="filters" role="group" aria-label="Filter">
  <button type="button" data-f="open" aria-pressed="true">Waiting</button>
  <button type="button" data-f="all" aria-pressed="false">All</button>
</div>
<div id="list"></div>
</main>
<script>
const list = document.getElementById('list');
let data = { questions: [], answers: {} };
let filter = 'open';

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k) n.append(k);
  return n;
}

function card(q) {
  const a = data.answers[q.id];
  const box = el('section', { class: 'q' });
  const badge = el('span', { class: 'badge ' + (a ? 'done' : 'open'), text: a ? 'Answered ' + new Date(a.at).toLocaleString() : 'Waiting' });
  box.append(el('h3', { text: q.title }), badge);
  if (q.context) box.append(el('p', { text: q.context }));
  const inputs = [];
  for (const o of q.options || []) {
    const input = el('input', { type: q.type === 'single' ? 'radio' : 'checkbox', name: q.id, value: o.id });
    if (a ? a.choices.includes(o.id) : false) input.checked = true;
    inputs.push(input);
    const isDefault = (q.default || []).includes(o.id);
    const text = el('span', {}, el('span', { text: o.label + (isDefault ? '  (default)' : '') }), o.note ? el('small', { text: o.note }) : null);
    box.append(el('label', {}, input, text));
  }
  const ta = el('textarea', { placeholder: q.type === 'text' ? 'Your answer' : 'Anything to add, or a different answer entirely' });
  if (a && a.text) ta.value = a.text;
  box.append(ta);
  const note = el('span', { class: 'dim' });
  const btn = el('button', { type: 'button', text: a ? 'Update answer' : 'Save answer' });
  btn.addEventListener('click', async () => {
    const choices = inputs.filter((i) => i.checked).map((i) => i.value);
    if (!choices.length && !ta.value.trim()) { note.textContent = 'Pick an option or type something first.'; return; }
    note.textContent = 'Saving...';
    try {
      const r = await fetch('/api/answers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: q.id, choices, text: ta.value }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);
      data.answers[q.id] = j.answer;
      note.textContent = 'Saved. The loop reads it on its next iteration.';
      badge.className = 'badge done'; badge.textContent = 'Answered just now'; btn.textContent = 'Update answer';
    } catch (e) { note.textContent = 'Could not save: ' + e.message; }
  });
  box.append(el('div', { class: 'row' }, btn, note));
  return box;
}

function render() {
  list.replaceChildren();
  const qs = data.questions.filter((q) => filter === 'all' || !data.answers[q.id]);
  if (!qs.length) list.append(el('p', { class: 'dim', text: filter === 'open' ? 'Nothing is waiting for you.' : 'No questions yet.' }));
  for (const q of qs) list.append(card(q));
}

for (const b of document.querySelectorAll('.filters button')) {
  b.addEventListener('click', () => {
    filter = b.dataset.f;
    for (const x of document.querySelectorAll('.filters button')) x.setAttribute('aria-pressed', String(x === b));
    render();
  });
}

fetch('/api/questions').then((r) => r.json()).then((j) => { data = j; render(); })
  .catch(() => { list.append(el('p', { text: 'Could not load the questions.' })); });
</script>
</body>
</html>
