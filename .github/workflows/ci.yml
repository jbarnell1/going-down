name: ci

# The clean-machine check: install from the lockfile, typecheck, run the rule tests, build,
# then drive the real game in a browser and keep the screenshots.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck, rule tests, build
        run: npm run check
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Drive the game in a browser
        run: npm run e2e
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Package the build for the public play link
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The Godot game's own tests, on a clean machine with the official Linux engine.
  # Separate from the browser game above, and nothing waits on it.
  godot:
    runs-on: ubuntu-latest
    # The quick set passed 15 minutes when the furniture tests joined it (18 Nov 2026).
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Remember the engine download
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: Godot_v4.7.2-stable_linux.x86_64.zip
          key: godot-engine-4.7.2-stable-linux-x86_64
      - name: Download the engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: curl -fsSL -o Godot_v4.7.2-stable_linux.x86_64.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
      - name: Check the engine matches its published checksum
        run: echo "9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  Godot_v4.7.2-stable_linux.x86_64.zip" | sha512sum -c -
      - name: Unpack the engine
        run: |
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      # A fresh checkout has no class list yet (godot/.godot is not committed), so scripts that name
      # global classes (Lift, FacePaint, RulesBridge) fail to load until the project is imported once.
      - name: Import the Godot project
        run: timeout 300 ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --import
      - name: Run the Godot tests
        run: timeout 2400 ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/run_tests.gd -- --quick

  # The public play link. Runs only after every check above passed, and only for main,
  # so the link never holds a build that failed a test.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
