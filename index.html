<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Going Down</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
      #hud { position: fixed; left: 12px; bottom: 10px; color: #3d4a44; font: 12px ui-monospace, Consolas, monospace; opacity: 0.7; pointer-events: none; }
      #debug { position: fixed; left: 12px; top: 10px; color: #f2f5f3; background: rgba(0, 0, 0, 0.55); padding: 4px 8px; font: 12px ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; }
      #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 16, 14, 0.55); color: #eef3f0; font: 600 20px ui-monospace, Consolas, monospace; letter-spacing: 0.08em; cursor: pointer; user-select: none; }
      #start small { display: block; margin-top: 10px; font-weight: 400; font-size: 13px; opacity: 0.75; letter-spacing: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="debug" hidden></div>
    <div id="start"><div>CLICK TO START<small>WASD walk &middot; Shift creep &middot; mouse look &middot; Esc release</small></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
