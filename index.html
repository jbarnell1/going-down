<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Going Down</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      /* A phone must not scroll, zoom, select text or open a menu while thumbs are on the screen. */
      html, body { touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; image-rendering: pixelated; }
      #start .touch { display: none; }
      @media (pointer: coarse) { #start .mouse { display: none; } #start .touch { display: block; } }
      #start .turn { display: none; }
      @media (pointer: coarse) and (orientation: portrait) { #start .turn { display: block; } }
      #hud { position: fixed; left: 12px; bottom: 10px; color: #3d4a44; font: 12px ui-monospace, Consolas, monospace; opacity: 0.7; pointer-events: none; }
      #debug { position: fixed; left: 12px; top: 10px; color: #f2f5f3; background: rgba(0, 0, 0, 0.55); padding: 4px 8px; font: 12px ui-monospace, Consolas, monospace; white-space: pre; pointer-events: none; }
      #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 16, 14, 0.55); color: #eef3f0; font: 600 20px ui-monospace, Consolas, monospace; letter-spacing: 0.08em; cursor: pointer; user-select: none; }
      #start small { display: block; margin-top: 10px; font-weight: 400; font-size: 13px; opacity: 0.75; letter-spacing: 0; }
      #debug #minimap { display: block; margin-top: 4px; width: 168px; max-width: 24vw; height: auto; image-rendering: pixelated; }
      /* The camcorder display: inside the picture's safe area, never near the centre. */
      #osd canvas { position: fixed; image-rendering: pixelated; opacity: 0.82; pointer-events: none; }
      #osd .osd-top { top: max(5vh, 10px); right: max(5vw, 14px); }
      #osd .osd-bottom { bottom: max(6vh, 12px); right: max(5vw, 14px); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="debug" hidden></div>
    <div id="start">
      <div class="mouse">CLICK TO START<small>WASD walk &middot; Shift creep &middot; mouse look &middot; Esc release</small></div>
      <div class="touch">TAP TO START<small>Left thumb walks, push gently to creep &middot; right thumb looks</small><small class="turn">Turn your phone sideways for a wider view</small></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
